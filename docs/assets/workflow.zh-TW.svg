<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">從需求到執行</title><desc id="desc">需求先經 Advisor 拆解、逐任務評估與模型配置，產生計畫，再由 Coordinator 依 executionMode 執行與驗證。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53708c"/></marker></defs><rect width="960" height="310" rx="16" fill="#f6f8fc"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="40" font-size="25" fill="#16263d" font-weight="650" text-anchor="start">從需求到執行</text><rect x="208" y="70" width="538" height="32" rx="8" fill="#e3edf9"/><text x="477" y="92" font-size="17" fill="#244f80" font-weight="600" text-anchor="middle">Advisor：規劃與配置</text><text x="847" y="92" font-size="17" fill="#23644f" font-weight="600" text-anchor="middle">Coordinator</text><rect x="24" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="36" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">01</text><text x="112" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">需求</text><text x="112" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">描述工作與驗收</text><path d="M202 167 H206" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="208" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="220" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">02</text><text x="296" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">有界任務</text><text x="296" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">必要才拆解</text><path d="M386 167 H390" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="392" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="404" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">03</text><text x="480" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">模型配置</text><text x="480" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">逐任務評估</text><path d="M570 167 H574" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="588" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">04</text><text x="664" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">派送計畫</text><text x="664" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">相依 / 並行 / 條件</text><path d="M754 167 H758" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="118" width="176" height="98" rx="12" fill="#edf6f1" stroke="#cdd8e5"/><text x="772" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">05</text><text x="848" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">執行與驗證</text><text x="848" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">委派 / 整合 / 驗收</text><text x="28" y="253" font-size="16" fill="#244f80" font-weight="400" text-anchor="start">plan：停在計畫  ·  confirm：同意後執行  ·  auto：直接執行</text><text x="28" y="282" font-size="14" fill="#53677f" font-weight="400" text-anchor="start">推薦配置是意圖；實際 worker model / effort 需 Host 證據確認。</text></g></svg>

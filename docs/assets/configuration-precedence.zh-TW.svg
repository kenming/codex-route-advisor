<svg xmlns="http://www.w3.org/2000/svg" width="960" height="433" viewBox="0 0 960 433" role="img" aria-labelledby="title desc"><title id="title">設定優先順序</title><desc id="desc">同一欄位優先取 Session，其次 Workspace、Global、Skill defaults。Session 不持久化，未覆寫欄位沿用下一層。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53708c"/></marker></defs><rect width="960" height="433" rx="16" fill="#f6f8fc"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="40" font-size="25" fill="#16263d" font-weight="650" text-anchor="start">設定優先順序</text><text x="28" y="68" font-size="15" fill="#53677f" font-weight="400" text-anchor="start">同一欄位：高優先層覆寫低優先層</text><rect x="28" y="91" width="904" height="52" rx="10" fill="#e3edf9" stroke="#cdd8e5"/><text x="47" y="124" font-size="14" fill="#637c97" font-weight="600" text-anchor="start">01</text><text x="95" y="124" font-size="19" fill="#16263d" font-weight="600" text-anchor="start">Session</text><text x="348" y="124" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">最高優先 · 本次對話 · 不寫檔</text><path d="M480 145 V151" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="155" width="904" height="52" rx="10" fill="#ffffff" stroke="#cdd8e5"/><text x="47" y="188" font-size="14" fill="#637c97" font-weight="600" text-anchor="start">02</text><text x="95" y="188" font-size="19" fill="#16263d" font-weight="600" text-anchor="start">Workspace</text><text x="348" y="188" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">目前 Project · 持久化設定</text><path d="M480 209 V215" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="219" width="904" height="52" rx="10" fill="#ffffff" stroke="#cdd8e5"/><text x="47" y="252" font-size="14" fill="#637c97" font-weight="600" text-anchor="start">03</text><text x="95" y="252" font-size="19" fill="#16263d" font-weight="600" text-anchor="start">Global</text><text x="348" y="252" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">使用者層級 · 持久化設定</text><path d="M480 273 V279" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="283" width="904" height="52" rx="10" fill="#ffffff" stroke="#cdd8e5"/><text x="47" y="316" font-size="14" fill="#637c97" font-weight="600" text-anchor="start">04</text><text x="95" y="316" font-size="19" fill="#16263d" font-weight="600" text-anchor="start">Skill defaults</text><text x="348" y="316" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">未設定時採用的預設值</text><text x="28" y="376" font-size="15" fill="#244f80" font-weight="400" text-anchor="start">逐欄位合併：未覆寫的 model / effort 等欄位，沿用下層設定。</text><text x="28" y="404" font-size="14" fill="#53677f" font-weight="400" text-anchor="start">新對話不繼承 Session override；設定檔位置見下方表格。</text></g></svg>

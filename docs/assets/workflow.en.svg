<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">From request to execution</title><desc id="desc">Advisor decomposes the request, assesses each task and allocates profiles. The Coordinator follows executionMode to execute and validate the plan.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53708c"/></marker></defs><rect width="960" height="310" rx="16" fill="#f6f8fc"/><g font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="28" y="40" font-size="25" fill="#16263d" font-weight="650" text-anchor="start">From request to execution</text><rect x="208" y="70" width="538" height="32" rx="8" fill="#e3edf9"/><text x="477" y="92" font-size="17" fill="#244f80" font-weight="600" text-anchor="middle">Advisor: planning and allocation</text><text x="847" y="92" font-size="17" fill="#23644f" font-weight="600" text-anchor="middle">Coordinator</text><rect x="24" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="36" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">01</text><text x="112" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">Request</text><text x="112" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">Goal + acceptance</text><path d="M202 167 H206" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="208" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="220" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">02</text><text x="296" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">Bounded Tasks</text><text x="296" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">Split only if needed</text><path d="M386 167 H390" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="392" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="404" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">03</text><text x="480" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">Model allocation</text><text x="480" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">Per-task assessment</text><path d="M570 167 H574" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="118" width="176" height="98" rx="12" fill="#ffffff" stroke="#cdd8e5"/><text x="588" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">04</text><text x="664" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">Dispatch Plan</text><text x="664" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">Order / groups / gates</text><path d="M754 167 H758" stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"/><rect x="760" y="118" width="176" height="98" rx="12" fill="#edf6f1" stroke="#cdd8e5"/><text x="772" y="146" font-size="13" fill="#637c97" font-weight="600" text-anchor="start">05</text><text x="848" y="171" font-size="17" fill="#16263d" font-weight="600" text-anchor="middle">Execute + validate</text><text x="848" y="198" font-size="13" fill="#53677f" font-weight="400" text-anchor="middle">Delegate + integrate</text><text x="28" y="253" font-size="16" fill="#244f80" font-weight="400" text-anchor="start">plan: stop at plan  ·  confirm: execute after approval  ·  auto: continue</text><text x="28" y="282" font-size="14" fill="#53677f" font-weight="400" text-anchor="start">Recommended profiles are intent; actual worker model / effort requires Host evidence.</text></g></svg>
